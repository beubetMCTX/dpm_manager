      <g transform="rotate(112.5 128 128)"><path d="M128 128 L128 34" stroke="currentColor" stroke-width="8"/><path d="M128 17 L115 42 L123 39 L128 47 L133 39 L141 42 Z"/></g>
      <g transform="rotate(157.5 128 128)"><path d="M128 128 L128 34" stroke="currentColor" stroke-width="8"/><path d="M128 17 L115 42 L123 39 L128 47 L133 39 L141 42 Z"/></g>
    </g>
    <g fill="#49c9e8" color="#49c9e8">
      <g transform="rotate(202.5 128 128)"><path d="M128 128 L128 34" stroke="currentColor" stroke-width="8"/><path d="M128 17 L115 42 L123 39 L128 47 L133 39 L141 42 Z"/></g>
      <g transform="rotate(247.5 128 128)"><path d="M128 128 L128 34" stroke="currentColor" stroke-width="8"/><path d="M128 17 L115 42 L123 39 L128 47 L133 39 L141 42 Z"/></g>
      <g transform="rotate(292.5 128 128)"><path d="M128 128 L128 34" stroke="currentColor" stroke-width="8"/><path d="M128 17 L115 42 L123 39 L128 47 L133 39 L141 42 Z"/></g>
