<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202a33"/>
      <stop offset="1" stop-color="#10161c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- Two-layer split ring: orange on left, blue on right. -->
  <path d="M128 55 A73 73 0 0 0 128 201" fill="none" stroke="#8b431e" stroke-width="24" opacity="0.55"/>
  <path d="M128 55 A73 73 0 0 1 128 201" fill="none" stroke="#0a526d" stroke-width="24" opacity="0.55"/>
  <path d="M128 55 A73 73 0 0 0 128 201" fill="none" stroke="#f28c28" stroke-width="13" stroke-linecap="round"/>
  <path d="M128 55 A73 73 0 0 1 128 201" fill="none" stroke="#49c9e8" stroke-width="13" stroke-linecap="round"/>

  <circle cx="128" cy="128" r="17" fill="#15232c" stroke="#8feaff" stroke-width="7"/>

  <!-- Eight arrows start at the hub and pierce the ring outward. -->
  <g stroke="#d6fbff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <g fill="#f28c28">
      <g transform="rotate(0 128 128)"><path d="M128 128 L128 39" stroke-width="8"/><path d="M128 25 L115 45 L123 42 L128 50 L133 42 L141 45 Z"/></g>
      <g transform="rotate(45 128 128)"><path d="M128 128 L128 39" stroke-width="8"/><path d="M128 25 L115 45 L123 42 L128 50 L133 42 L141 45 Z"/></g>
      <g transform="rotate(90 128 128)"><path d="M128 128 L128 39" stroke-width="8"/><path d="M128 25 L115 45 L123 42 L128 50 L133 42 L141 45 Z"/></g>
      <g transform="rotate(135 128 128)"><path d="M128 128 L128 39" stroke-width="8"/><path d="M128 25 L115 45 L123 42 L128 50 L133 42 L141 45 Z"/></g>
    </g>
    <g fill="#49c9e8">
      <g transform="rotate(180 128 128)"><path d="M128 128 L128 39" stroke-width="8"/><path d="M128 25 L115 45 L123 42 L128 50 L133 42 L141 45 Z"/></g>
      <g transform="rotate(225 128 128)"><path d="M128 128 L128 39" stroke-width="8"/><path d="M128 25 L115 45 L123 42 L128 50 L133 42 L141 45 Z"/></g>
      <g transform="rotate(270 128 128)"><path d="M128 128 L128 39" stroke-width="8"/><path d="M128 25 L115 45 L123 42 L128 50 L133 42 L141 45 Z"/></g>
      <g transform="rotate(315 128 128)"><path d="M128 128 L128 39" stroke-width="8"/><path d="M128 25 L115 45 L123 42 L128 50 L133 42 L141 45 Z"/></g>
    </g>
  </g>
  <circle cx="128" cy="128" r="5" fill="#e9fdff"/>
</svg>
