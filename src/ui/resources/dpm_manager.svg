    <g fill="#f28c28" color="#f28c28">
      <g transform="rotate(22.5 128 128)"><path d="M128 128 L128 34" stroke="currentColor" stroke-width="8"/><path d="M128 17 L115 42 L123 39 L128 47 L133 39 L141 42 Z"/></g>
