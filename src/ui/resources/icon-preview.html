<!doctype html>
<meta charset="utf-8">
<title>DPM Manager SVG icons</title>
<style>
  body { background:#101418; color:#e7edf2; font:16px Segoe UI,sans-serif; padding:28px; }
  .grid { display:grid; grid-template-columns:repeat(3,160px); gap:18px; }
  .item { background:#1a222a; border:1px solid #33414c; border-radius:10px; padding:18px 12px 12px; text-align:center; }
  img { width:96px; height:96px; display:block; margin:auto; }
  span { display:block; margin-top:10px; color:#9edee7; font-size:13px; }
</style>
<div class="grid">
  <div class="item"><img src="icon-select.svg"><span>选择</span></div>
  <div class="item"><img src="icon-translate.svg"><span>平移</span></div>
  <div class="item"><img src="icon-rotate.svg"><span>旋转</span></div>
  <div class="item"><img src="icon-new-injector.svg"><span>新建喷注器</span></div>
  <div class="item"><img src="icon-assembly.svg"><span>创建组件</span></div>
  <div class="item"><img src="icon-array.svg"><span>阵列工具</span></div>
  <div class="item"><img src="icon-fill.svg"><span>填充工具</span></div>
  <div class="item"><img src="icon-reference-tool.svg"><span>参考几何体工具</span></div>
</div>
