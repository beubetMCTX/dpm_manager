<!doctype html>
<meta charset="utf-8">
<title>KSP / ZTheme 风格工具栏图标预览</title>
<style>
  body { margin: 0; padding: 32px; background: #08090b; color: #d8d9dd; font: 16px "Segoe UI", sans-serif; }
  h2 { font-weight: 400; color: #cfd1d6; margin: 0 0 20px; }
  p { color: #858891; margin: 0 0 22px; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 9px 14px; background: #202125; border: 1px solid #3b3d44; box-shadow: 0 5px 18px #0008; }
  .tool { display: flex; align-items: center; gap: 6px; color: #b8bac0; font-size: 15px; }
  .tool img { width: 38px; height: 38px; image-rendering: auto; }
  .tool.active { color: #f0f1f3; }
  .grid { display: grid; grid-template-columns: repeat(3, 150px); gap: 18px; margin-top: 28px; }
  .card { background: #1d1f24; border: 1px solid #3c3f47; padding: 16px; text-align: center; }
  .card img { width: 84px; height: 84px; }
  .card span { display: block; margin-top: 9px; color: #b9bbc1; }
</style>
<h2>KSP / ZTheme 风格工具栏图标</h2>
<p>仅用于预览，尚未接入 Qt 工程。</p>
<div class="toolbar">
  <div class="tool"><img src="preview-ksp-select.svg"><span>选择</span></div>
  <div class="tool active"><img src="preview-ksp-translate-on.svg"><span>平移</span></div>
  <div class="tool"><img src="preview-ksp-rotate-off.svg"><span>旋转</span></div>
</div>
<div class="grid">
  <div class="card"><img src="preview-ksp-select.svg"><span>选择</span></div>
  <div class="card"><img src="preview-ksp-translate-off.svg"><span>平移（未选中）</span></div>
  <div class="card"><img src="preview-ksp-translate-on.svg"><span>平移（选中）</span></div>
  <div class="card"><img src="preview-ksp-rotate-off.svg"><span>旋转（未选中）</span></div>
  <div class="card"><img src="preview-ksp-rotate-on.svg"><span>旋转（选中）</span></div>
</div>
